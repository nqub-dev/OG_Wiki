name: Deploy to Cloudflare Pages

# OPT-IN. This project currently deploys via Netlify's own GitHub integration
# (see netlify.toml), which builds and publishes automatically on push — this
# workflow would just fail with no CLOUDFLARE_* secrets set, on every commit.
#
# Kept as a reference for later: Cloudflare Pages + Cloudflare Access is the
# better fit once a wiki needs to be gated for an external CLIENT rather than
# read by the internal team, since GitHub Pages can't serve a private site
# without GitHub Enterprise Cloud, and Netlify's own access controls are a
# paid feature. To switch a given wiki over:
#   1. Add branches:[main] back to the `on.push` trigger below.
#   2. Set the three repo secrets/variable listed in the job below.
#   3. Turn off Netlify's auto-deploy for this repo so the two don't race.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — from the Cloudflare dashboard URL
# Required repository variable:
#   CLOUDFLARE_PROJECT_NAME — the Pages project to deploy into

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  # Needed to leave the preview URL as a PR comment.
  pull-requests: write

concurrency:
  # Never let two deploys of the same branch race each other.
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Only production deploys are blocked by placeholders. PR previews are
      # allowed to be half-finished — that is what a preview is for.
      - name: Preflight
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run preflight -- --strict

      # Builds the site AND the Pagefind index. Never replace this with
      # `astro build` alone — search would silently return nothing.
      - name: Build site and search index
        run: npm run build

      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pushing a non-production branch creates an isolated preview
          # deployment on its own URL, which is what PR reviewers open.
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url) return;
            const marker = '<!-- wiki-preview -->';
            const body = `${marker}\n📖 **Wiki preview:** ${url}\n\nSearch is included in this build, so \`⌘K\` works here exactly as it will in production.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
