name: Deploy to Cloudflare Pages

# The recommended target for CLIENT wikis.
#
# Why not GitHub Pages: Pages cannot serve a private site unless the org is on
# GitHub Enterprise Cloud. This is a static build — every file in dist/ is
# downloadable by anyone who knows its URL, and the Pagefind index is a second
# copy of the page text — so access control has to happen at the edge.
# Cloudflare Access sits in front of this deployment and gates it by email,
# one-time PIN, or SSO, with no application changes.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — from the Cloudflare dashboard URL
# Required repository variable:
#   CLOUDFLARE_PROJECT_NAME — the Pages project to deploy into

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  # Needed to leave the preview URL as a PR comment.
  pull-requests: write

concurrency:
  # Never let two deploys of the same branch race each other.
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Only production deploys are blocked by placeholders. PR previews are
      # allowed to be half-finished — that is what a preview is for.
      - name: Preflight
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run preflight -- --strict

      # Builds the site AND the Pagefind index. Never replace this with
      # `astro build` alone — search would silently return nothing.
      - name: Build site and search index
        run: npm run build

      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pushing a non-production branch creates an isolated preview
          # deployment on its own URL, which is what PR reviewers open.
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url) return;
            const marker = '<!-- wiki-preview -->';
            const body = `${marker}\n📖 **Wiki preview:** ${url}\n\nSearch is included in this build, so \`⌘K\` works here exactly as it will in production.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
