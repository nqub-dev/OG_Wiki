name: Deploy to GitHub Pages

# OPT-IN, for PUBLIC wikis only (open-source docs, public handbooks).
#
# GitHub Pages cannot serve a private site without GitHub Enterprise Cloud,
# so it is the wrong target for client documentation. Client wikis use
# deploy-cloudflare.yml, which can sit behind Cloudflare Access.
#
# Deliberately manual-only: if this also ran on push to main it would race
# the Cloudflare workflow and publish the same commit twice. To make a wiki
# public-by-default, add `push: branches: [main]` back here and delete
# deploy-cloudflare.yml.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Refuses to publish a wiki that still has template placeholders
      # (example.com, your-org, "OG Wiki") in wiki.config.ts.
      - name: Preflight
        run: npm run preflight -- --strict

      - name: Build site and search index
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
