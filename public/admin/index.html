<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Wiki editor</title>
  </head>
  <body>
    <!--
      Sveltia CMS — a git-backed editor for people who will never open a
      terminal. It commits Markdown straight to the repo, so the CMS is just
      another way of doing what a developer does with `git commit`. There is no
      database and no second copy of the content.

      Pinned on purpose: an unpinned CDN URL means the client's editor can
      change under them without a deploy.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0.108.0/dist/sveltia-cms.js"></script>
  </body>
</html>
