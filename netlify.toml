# Used when you connect this repo to Netlify for automatic deploys.
# Netlify Drop ignores this file — Drop just takes the folder you drag.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# `npm run build` runs Astro AND Pagefind. Never shorten this to `astro build`:
# the site would deploy fine and search would silently return nothing.
